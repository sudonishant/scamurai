name: Validate and deploy Scamurai

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "scamurai-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  validate:
    name: Backend, frontend, browser and security gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Multilingual lexical diagnostic
        working-directory: backend
        run: python scripts/evaluate_multilingual.py --output "$RUNNER_TEMP/scamurai-multilingual-evaluation.json"

      - name: Validate experiment notebook structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('notebooks/multilingual_semantic_evaluation.ipynb')
          notebook = json.loads(path.read_text(encoding='utf-8'))
          assert notebook['nbformat'] == 4 and notebook['cells']
          for index, cell in enumerate(notebook['cells']):
              if cell['cell_type'] == 'code':
                  compile(''.join(cell['source']), f'{path}:cell-{index}', 'exec')
              assert not cell.get('outputs')
          PY

      - name: Upload multilingual diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: multilingual-evaluation
          path: ${{ runner.temp }}/scamurai-multilingual-evaluation.json
          retention-days: 14

      - name: Migration upgrade, model diff and downgrade smoke
        working-directory: backend
        env:
          SCAMURAI_DATABASE_URL: sqlite:////tmp/scamurai-ci-migration.db
          SCAMURAI_STORAGE_DIR: /tmp/scamurai-ci-migration-storage
        run: |
          rm -f /tmp/scamurai-ci-migration.db
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Python static security scan
        working-directory: backend
        run: bandit -q -r app worker.py -ll

      - name: Python dependency vulnerability scan
        working-directory: backend
        run: pip-audit -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend dependency vulnerability scan
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify Pages route-recovery artifact
        run: test -f frontend/dist/404.html

      - name: Start disposable browser-test services
        run: |
          cd backend
          SCAMURAI_DATABASE_URL=sqlite:////tmp/scamurai-browser.db \
          SCAMURAI_STORAGE_DIR=/tmp/scamurai-browser-storage \
            uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/scamurai-api.log 2>&1 &
          cd ../frontend
          npm run dev -- --host 127.0.0.1 >/tmp/scamurai-ui.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/scamurai-api.log /tmp/scamurai-ui.log
          exit 1

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload accessibility report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            frontend/test-results
            /tmp/scamurai-api.log
            /tmp/scamurai-ui.log
          if-no-files-found: ignore

  compose-smoke:
    name: Real PostgreSQL, MinIO and Celery smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for smoke client
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install smoke client
        run: python -m pip install httpx

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build and start disposable full stack
        run: docker compose up --build -d

      - name: Verify Postgres, S3 upload/readback and Celery completion
        run: python backend/scripts/compose_smoke.py

      - name: Show stack diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail=150

      - name: Remove disposable stack and volumes
        if: always()
        run: docker compose down -v --remove-orphans

  build-and-deploy:
    name: Deploy validated static UI to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [validate, compose-smoke]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          # Optional non-secret FastAPI origin/path. Never put bearer tokens or
          # provider keys in a public Pages build.
          VITE_API_BASE_URL: ${{ vars.SCAMURAI_PUBLIC_API_URL }}

      - name: Verify Pages route-recovery artifact
        run: test -f frontend/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Add Pages marker and fallback
        run: |
          touch frontend/dist/.nojekyll
          cp frontend/dist/index.html frontend/dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
